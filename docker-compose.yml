name: crm-superauto

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crm}
      TZ: America/Sao_Paulo
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d crm && psql -U $${POSTGRES_USER} -d keycloak -c 'select 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Caixa de e-mail falsa para o "esqueci minha senha" do Keycloak (interface em http://localhost:8025).
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-crm}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-crm}
      # O navegador acessa o Keycloak por localhost:${KEYCLOAK_PORT}; o "iss" dos tokens fica fixo nessa URL.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8180}
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      TZ: America/Sao_Paulo
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ./infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      # A imagem não tem curl; usa /dev/tcp do bash na porta de gerenciamento (9000).
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/crm
      DB_USER: ${POSTGRES_USER:-crm}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-crm}
      # Issuer = URL que o navegador usa (vai no "iss" do token).
      # As chaves são buscadas pela rede interna do compose.
      KEYCLOAK_ISSUER: http://localhost:${KEYCLOAK_PORT:-8180}/realms/crm
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/crm/protocol/openid-connect/certs
      CORS_ORIGENS: http://localhost:4200,http://localhost:${FRONTEND_PORT:-8081}
      TZ: America/Sao_Paulo
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
