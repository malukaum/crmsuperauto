# Tema de login do CRM Super Auto: o keycloak.v2 (PatternFly 5) com as cores e a tipografia da marca.
# Telas e e-mails em português vêm do realm (internationalizationEnabled, defaultLocale pt-BR).
parent=keycloak.v2
import=common/keycloak

# css/styles.css é o do tema pai; crm.css vem depois e sobrescreve.
styles=css/styles.css css/crm.css

# A marca não tem versão escura.
darkMode=false
