spring:
  application:
    name: crm-superauto
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/crm}
    username: ${DB_USER:crm}
    password: ${DB_PASSWORD:crm}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      # RG-06: quem espera uma trava de linha (cadastros em alteração) desiste após 5 s e recebe 409.
      jakarta.persistence.lock.timeout: 5000
      hibernate:
        jdbc:
          time_zone: America/Sao_Paulo
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
  data:
    web:
      # Tabelas paginadas no servidor: ?pagina=0&tamanho=25 (máximo 100 por página).
      pageable:
        page-parameter: pagina
        size-parameter: tamanho
        default-page-size: 25
        max-page-size: 100
  jackson:
    time-zone: America/Sao_Paulo
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      # IA-01: até 5 anexos de até 10 MB por atendimento.
      max-file-size: 10MB
      max-request-size: 55MB

crm:
  fuso-horario: America/Sao_Paulo
  ia:
    # IA-05: cifra as chaves dos provedores no banco. Em produção, defina CRM_IA_CHAVE_MESTRA e guarde-a bem:
    # trocar a chave-mestra torna ilegíveis as chaves já gravadas (será preciso informá-las de novo).
    chave-mestra: ${CRM_IA_CHAVE_MESTRA:chave-mestra-somente-para-desenvolvimento}
    intervalo-do-processamento: PT20S
  seguranca:
    issuer: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/crm}
    jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/crm/protocol/openid-connect/certs}
    audiencia: ${KEYCLOAK_AUDIENCIA:crm-api}
  cors:
    origens: ${CORS_ORIGENS:http://localhost:4200}
  keycloak-admin:
    url: ${KEYCLOAK_URL:http://localhost:8180}
    realm: crm
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:crm-api}
    client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:crm-api-dev-secret}
  # Para onde o link do e-mail "definir senha" leva o usuário depois de concluir.
  frontend-url: ${FRONTEND_URL:http://localhost:4200}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
