spring:
  application:
    name: crm-superauto
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/crm}
    username: ${DB_USER:crm}
    password: ${DB_PASSWORD:crm}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: America/Sao_Paulo
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
  jackson:
    time-zone: America/Sao_Paulo
  mvc:
    problemdetails:
      enabled: true

crm:
  fuso-horario: America/Sao_Paulo
  seguranca:
    issuer: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/crm}
    jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/crm/protocol/openid-connect/certs}
    audiencia: ${KEYCLOAK_AUDIENCIA:crm-api}
  cors:
    origens: ${CORS_ORIGENS:http://localhost:4200}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
