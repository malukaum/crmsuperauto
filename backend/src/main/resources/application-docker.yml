# Execução dentro do docker-compose. Todas as URLs vêm de variáveis de ambiente (ver docker-compose.yml).
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

crm:
  seguranca:
    issuer: ${KEYCLOAK_ISSUER}
    jwk-set-uri: ${KEYCLOAK_JWK_SET_URI}
  cors:
    origens: ${CORS_ORIGENS}
  keycloak-admin:
    url: ${KEYCLOAK_URL}
  frontend-url: ${FRONTEND_URL}

logging:
  level:
    br.com.superauto.crm: INFO
